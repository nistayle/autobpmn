[project]
name = "autobpmn"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "google-genai>=1.30,<2",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
]

[tool.vercel]
entrypoint = "backend.server:app"

[tool.vercel.fastapi.static]
cdn = true
